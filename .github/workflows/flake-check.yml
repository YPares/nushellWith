name: "build nushell + std plugins & upload on cachix"
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: nushellwith
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix --accept-flake-config build .#nushell .#nushellWithStdPlugins
